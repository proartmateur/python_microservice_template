[project]
name = "microservice-template"
version = "0.1.0"
description = "Template base para microservicios con DDD y Arquitectura Hexagonal"
readme = "README.MD"
requires-python = ">=3.11"

# Aquí van tus dependencias de producción (equivalente a "dependencies" en package.json)
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",        # Driver para Postgres
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1", # Para manejar variables de entorno
    "uuid6>=2025.0.1",
    "faker>=33.0.0",
]

# Equivalente a la sección "scripts" de package.json
[tool.poe.tasks]
dev = "uvicorn src.main:app --reload --port 8000"
start = "uvicorn src.main:app --host 0.0.0.0 --port 8000"
test = "pytest tests/unit -v"
lint = "ruff check src/ .gen_cli/scripts tests/unit"
typecheck = "mypy src/ .gen_cli/scripts"
delete_module = "python .gen_cli/scripts/delete_module.py"
create_users_table = "python src/modules/users/scripts/create_users_table.py"
create_users_index = "python src/modules/users/scripts/create_users_index.py"
create_api_keys_table = "python src/modules/api_keys/scripts/create_api_keys_table.py"
create_api_keys_index = "python src/modules/api_keys/scripts/create_api_keys_index.py"


[tool.ruff]
# Configuración del linter (código limpio y sostenible)
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Habilitamos las reglas base (E, F) y la regla de McCabe (C90)
select = ["E", "F", "C90"]

[tool.ruff.lint.mccabe]
# El estándar de la industria es 10.
# Si una función tiene más de 10 caminos lógicos, Ruff lanzará un error.
max-complexity = 10

[tool.mypy]
# Configuración estricta de tipado para tu core de dominio
strict = true
exclude = ["venv", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: pruebas end-to-end con DB real (opt-in con RUN_E2E_USERS=1)",
]

[dependency-groups]
dev = [
    "poethepoet>=0.42.1",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
]
